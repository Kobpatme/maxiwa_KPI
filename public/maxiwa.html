<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXIWA KPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --mx-bg: #06101a;
      --mx-panel: rgba(10, 21, 34, 0.84);
      --mx-line: rgba(145, 177, 208, 0.14);
      --mx-text: #f3f7fb;
      --mx-muted: #96a9bc;
      --mx-teal: #22c1a1;
      --mx-blue: #4f7cff;
      --mx-amber: #ffb84d;
      --mx-green: #79efcc;
      --mx-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; }
    body {
      margin: 0;
      font-family: "Manrope", "IBM Plex Sans Thai", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79,124,255,0.16), transparent 24%),
        radial-gradient(circle at right top, rgba(34,193,161,0.14), transparent 20%),
        linear-gradient(145deg, #040b13 0%, #08111b 38%, #0b1624 100%);
      color: var(--mx-text);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0));
      pointer-events: none;
    }
    .mx-shell-card {
      background: var(--mx-panel);
      border: 1px solid var(--mx-line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--mx-shadow);
    }
    .mx-input, .mx-select, .mx-textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: var(--mx-text);
      font: inherit;
      padding: 12px 14px;
      outline: none;
    }
    .mx-btn {
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 16px;
    }
    .mx-btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--mx-blue), var(--mx-teal));
      box-shadow: 0 18px 36px rgba(34, 193, 161, 0.16);
    }
    .mx-btn-soft {
      color: var(--mx-text);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .mx-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .mx-status-completed { background: rgba(34,193,161,.14); color: #96f2dd; }
    .mx-status-process { background: rgba(79,124,255,.14); color: #c4d2ff; }
    .mx-status-pending { background: rgba(255,184,77,.14); color: #ffd59c; }
    .mx-status-hold { background: rgba(255,107,107,.14); color: #ffb7b7; }
    .mx-status-cancelled { background: rgba(255,255,255,.1); color: #d5dbe2; }
    .mx-grid-auto {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .mx-data-card {
      border-radius: 20px;
      padding: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script type="text/babel" src="/js/maxiwa.js"></script>
</body>
</html>
