<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METRIX Verity Executive View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('metrix-executive-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --mx-bg: #eef4f8;
      --mx-bg-top: #f8fbff;
      --mx-bg-bottom: #e7eef5;
      --mx-ink: #0f172a;
      --mx-panel: rgba(255, 255, 255, 0.94);
      --mx-panel-strong: #ffffff;
      --mx-surface: #f1f5f9;
      --mx-surface-strong: #e2e8f0;
      --mx-line: rgba(15, 23, 42, 0.12);
      --mx-line-strong: rgba(15, 23, 42, 0.22);
      --mx-text: #0f172a;
      --mx-muted: #475569;
      --mx-accent: #1e293b;
      --mx-indigo: #4f46e5;
      --mx-success: #047857;
      --mx-info: #0369a1;
      --mx-warning: #b45309;
      --mx-danger: #be123c;
      --mx-brass: #c0841a;
      --mx-chart-total: #2563eb;
      --mx-chart-completed: #059669;
      --mx-chart-risk: #e11d48;
      --mx-shadow: 0 22px 70px rgba(15, 23, 42, 0.12);
      --mx-shadow-soft: 0 12px 34px rgba(15, 23, 42, 0.08);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --mx-bg: #08111f;
      --mx-bg-top: #111827;
      --mx-bg-bottom: #050b14;
      --mx-ink: #e5eefb;
      --mx-panel: rgba(17, 24, 39, 0.92);
      --mx-panel-strong: #111827;
      --mx-surface: #162033;
      --mx-surface-strong: #1f2a44;
      --mx-line: rgba(148, 163, 184, 0.18);
      --mx-line-strong: rgba(203, 213, 225, 0.28);
      --mx-text: #e5eefb;
      --mx-muted: #a8b6c9;
      --mx-accent: #dbeafe;
      --mx-indigo: #8b8cff;
      --mx-success: #34d399;
      --mx-info: #38bdf8;
      --mx-warning: #fbbf24;
      --mx-danger: #fb7185;
      --mx-brass: #facc15;
      --mx-chart-total: #60a5fa;
      --mx-chart-completed: #34d399;
      --mx-chart-risk: #fb7185;
      --mx-shadow: 0 22px 72px rgba(0, 0, 0, 0.36);
      --mx-shadow-soft: 0 12px 34px rgba(0, 0, 0, 0.26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", "IBM Plex Sans Thai", sans-serif;
      background:
        linear-gradient(90deg, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(15, 23, 42, 0.025) 1px, transparent 1px),
        linear-gradient(180deg, var(--mx-bg-top) 0%, var(--mx-bg) 46%, var(--mx-bg-bottom) 100%);
      background-size: 72px 72px, 72px 72px, auto;
      color: var(--mx-text);
      letter-spacing: 0;
      overflow-x: hidden;
    }
    button, input, select { font: inherit; }
    .mx-card {
      background: var(--mx-panel);
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      box-shadow: var(--mx-shadow);
    }
    .mx-soft {
      background: var(--mx-surface);
      border: 1px solid var(--mx-line);
      border-radius: 10px;
    }
    .mx-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--mx-line-strong);
      white-space: nowrap;
    }
    .mx-btn {
      border: 1px solid var(--mx-line-strong);
      border-radius: 999px;
      background: var(--mx-panel-strong);
      color: var(--mx-text);
      cursor: pointer;
      font-weight: 800;
      padding: 10px 14px;
      transition: background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    }
    .mx-btn:hover {
      border-color: var(--mx-info);
      box-shadow: 0 10px 22px rgba(3, 105, 161, .12);
    }
    .mx-btn-primary {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #ffffff;
      border-color: rgba(37, 99, 235, .42);
    }
    .mx-input {
      width: 100%;
      border: 1px solid var(--mx-line-strong);
      border-radius: 10px;
      background: var(--mx-panel-strong);
      color: var(--mx-text);
      padding: 11px 13px;
      outline: none;
    }
    .mx-input:focus {
      border-color: var(--mx-info);
      box-shadow: 0 0 0 3px rgba(3, 105, 161, .14);
    }
    .status-good { background: rgba(4, 120, 87, 0.14); color: var(--mx-success); border-color: rgba(4, 120, 87, .28); }
    .status-info { background: rgba(3, 105, 161, 0.14); color: var(--mx-info); border-color: rgba(3, 105, 161, .28); }
    .status-warn { background: rgba(180, 83, 9, 0.16); color: var(--mx-warning); border-color: rgba(180, 83, 9, .32); }
    .status-bad { background: rgba(190, 18, 60, 0.14); color: var(--mx-danger); border-color: rgba(190, 18, 60, .30); }
    .status-neutral { background: rgba(71, 85, 105, 0.12); color: var(--mx-muted); border-color: var(--mx-line-strong); }
    .chart-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chart-grid {
      stroke: var(--mx-line-strong);
      stroke-width: 1;
    }
    .chart-label {
      fill: var(--mx-muted);
      font-size: 11px;
      font-weight: 800;
    }
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--mx-surface-strong);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--mx-indigo);
    }
    .hero-band {
      background:
        linear-gradient(120deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.92) 48%, rgba(3, 105, 161, 0.82)),
        var(--mx-ink);
      color: #f8f3e8;
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 28px 90px rgba(16, 19, 25, 0.32);
      overflow: hidden;
      position: relative;
    }
    .hero-band::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 5px;
      background: linear-gradient(90deg, var(--mx-success), var(--mx-brass), var(--mx-danger));
    }
    .hero-band .mx-card {
      background: color-mix(in srgb, #ffffff 8%, transparent);
      border-color: rgba(255, 255, 255, 0.13);
      box-shadow: none;
      color: #f8f3e8;
    }
    .hero-band .text-\[var\(--mx-muted\)\] {
      color: rgba(248, 243, 232, 0.70) !important;
    }
    .hero-band text {
      fill: #f8f3e8;
    }
    .stage-header {
      background:
        radial-gradient(circle at 92% 12%, rgba(37, 99, 235, .12), transparent 28%),
        radial-gradient(circle at 70% 84%, rgba(5, 150, 105, .10), transparent 26%),
        linear-gradient(135deg, var(--mx-panel), var(--mx-surface)),
        var(--mx-panel);
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .stage-header::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 0%, transparent 67%, rgba(37, 99, 235, 0.10) 67%, rgba(37, 99, 235, 0.10) 75%, transparent 75%),
        linear-gradient(90deg, rgba(15, 23, 42, 0.045), transparent 38%);
      pointer-events: none;
    }
    .stage-header > * {
      position: relative;
      z-index: 1;
    }
    .display-title {
      font-size: clamp(34px, 3.85vw, 64px);
      line-height: 1.03;
      max-width: 980px;
      font-weight: 900;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .section-title {
      font-size: clamp(22px, 2vw, 32px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
    }
    .metric-number {
      font-size: clamp(34px, 4.5vw, 64px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0;
    }
    .metric-card {
      min-height: 168px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: var(--mx-shadow-soft);
    }
    .metric-card::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 4px;
      background: currentColor;
      opacity: 0.22;
      border-radius: 999px 999px 0 0;
    }
    .insight-card {
      background: var(--mx-panel-strong);
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      box-shadow: var(--mx-shadow-soft);
    }
    .priority-watchlist-scroll {
      max-height: min(560px, 58vh);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 6px;
    }
    .priority-watchlist-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .priority-watchlist-scroll::-webkit-scrollbar-track {
      background: var(--mx-surface);
      border-radius: 999px;
    }
    .priority-watchlist-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--mx-info) 38%, transparent);
      border-radius: 999px;
    }
    .table-shell {
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-shell thead {
      background: var(--mx-surface);
    }
    .table-shell tbody tr {
      background: color-mix(in srgb, var(--mx-panel-strong) 84%, transparent);
    }
    .table-shell tbody tr:nth-child(even) {
      background: color-mix(in srgb, var(--mx-surface) 74%, transparent);
    }
    .table-shell tbody tr:hover {
      background: color-mix(in srgb, var(--mx-info) 9%, var(--mx-panel-strong));
    }
    .rank-chip {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--mx-info), var(--mx-indigo));
      color: #ffffff;
      font-weight: 900;
    }
    .control-panel {
      align-items: stretch;
    }
    .control-panel .mx-input,
    .control-panel .mx-btn {
      min-height: 46px;
    }
    .executive-header-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(520px, 0.48fr);
      gap: 24px;
      align-items: start;
    }
    .executive-controls {
      display: grid;
      grid-template-columns: 144px 164px 112px 150px 108px 96px;
      gap: 10px;
      justify-content: end;
      align-items: start;
    }
    .executive-controls .mx-input,
    .executive-controls .mx-btn {
      width: 100% !important;
      min-height: 48px;
    }
    .executive-controls .print-btn {
      grid-column: 6;
      justify-self: end;
      min-width: 92px;
      background: var(--mx-panel-strong);
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 108px;
    }
    .theme-toggle i {
      width: 16px;
      text-align: center;
    }
    .hero-band {
      padding-block: 30px !important;
    }
    .hero-band .presentation-grid {
      grid-template-columns: minmax(0, 1.08fr) minmax(540px, .92fr);
      align-items: stretch;
    }
    .hero-band .mx-card {
      min-height: 148px;
    }
    .hero-band .metric-card {
      min-height: 148px;
    }
    .hero-band svg {
      width: 104px;
      height: 104px;
      flex: 0 0 auto;
    }
    .tab-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px;
      background: rgba(251, 250, 246, 0.82);
      background: color-mix(in srgb, var(--mx-panel-strong) 82%, transparent);
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      box-shadow: var(--mx-shadow-soft);
      position: sticky;
      top: 12px;
      z-index: 20;
      backdrop-filter: blur(18px);
    }
    .tab-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--mx-muted);
      background: transparent;
      font-weight: 900;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .tab-button:hover {
      background: color-mix(in srgb, var(--mx-info) 10%, transparent);
      color: var(--mx-text);
    }
    .tab-button.active {
      background: linear-gradient(135deg, var(--mx-info), var(--mx-indigo));
      color: #ffffff;
      border-color: color-mix(in srgb, var(--mx-info) 58%, var(--mx-line));
      box-shadow: 0 12px 26px rgba(3, 105, 161, 0.20);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .leader-card,
    .employee-card {
      box-shadow: var(--mx-shadow-soft);
      min-height: 100%;
    }
    button.leader-card {
      border: 1px solid var(--mx-line);
      color: inherit;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    button.leader-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 44px rgba(3, 105, 161, 0.16);
      border-color: color-mix(in srgb, var(--mx-info) 42%, var(--mx-line));
    }
    .team-card-button {
      position: relative;
      overflow: hidden;
    }
    .team-card-button::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--mx-info), var(--mx-success), var(--mx-brass));
      opacity: .78;
    }
    .team-card-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 11px 12px;
      background: var(--mx-surface);
      color: var(--mx-ink);
      font-size: 12px;
      font-weight: 900;
    }
    .team-card-cta i {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--mx-info);
      color: #ffffff;
      font-size: 12px;
    }
    .mini-metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .mini-metric-grid > div {
      background: var(--mx-surface);
      border: 1px solid var(--mx-line);
      border-radius: 10px;
      padding: 12px;
      min-width: 0;
    }
    .mini-metric-grid span {
      display: block;
      color: var(--mx-muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .mini-metric-grid strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--mx-line-strong);
      border-radius: 999px;
      background: var(--mx-panel-strong);
      color: var(--mx-muted);
      font-weight: 900;
      padding: 9px 13px;
      cursor: pointer;
    }
    .pill.active {
      background: linear-gradient(135deg, var(--mx-info), var(--mx-indigo));
      color: #ffffff;
      border-color: color-mix(in srgb, var(--mx-info) 58%, var(--mx-line));
    }
    .employee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 20px;
    }
    .kpi-intelligence {
      overflow: hidden;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--mx-info) 10%, transparent), transparent 34%),
        linear-gradient(110deg, color-mix(in srgb, var(--mx-success) 10%, transparent), transparent 58%),
        var(--mx-panel);
    }
    .kpi-insight-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      min-width: 0;
    }
    .kpi-insight-card {
      min-width: 0;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 14px;
      background: var(--mx-panel-strong);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--mx-panel-strong) 80%, white);
    }
    .kpi-insight-card span {
      display: block;
      color: var(--mx-muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .kpi-insight-card strong {
      display: block;
      margin-top: 8px;
      color: var(--mx-ink);
      font-size: clamp(18px, 1.5vw, 26px);
      font-weight: 900;
      line-height: 1.08;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-insight-card em {
      display: block;
      margin-top: 6px;
      color: var(--mx-muted);
      font-size: 12px;
      font-style: normal;
      font-weight: 800;
      line-height: 1.25;
    }
    .kpi-analysis-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
      gap: 20px;
    }
    .kpi-portfolio-list {
      display: grid;
      gap: 12px;
    }
    .kpi-row-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) minmax(260px, .86fr);
      gap: 14px;
      align-items: center;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 14px;
      background: var(--mx-panel-strong);
    }
    .kpi-row-rank {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--mx-info), var(--mx-indigo));
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .kpi-row-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(54px, 1fr));
      gap: 8px;
      text-align: right;
    }
    .kpi-row-stats b,
    .kpi-row-stats em {
      display: block;
    }
    .kpi-row-stats b {
      color: var(--mx-ink);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.1;
    }
    .kpi-row-stats em {
      margin-top: 4px;
      color: var(--mx-muted);
      font-size: 10px;
      font-style: normal;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .watch-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 14px;
      background: var(--mx-panel-strong);
    }
    .watch-score {
      min-width: 78px;
      text-align: right;
    }
    .watch-score strong,
    .watch-score span {
      display: block;
    }
    .watch-score strong {
      color: var(--mx-ink);
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }
    .watch-score span {
      margin-top: 5px;
      color: var(--mx-muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .team-kpi-chip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 76px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--mx-surface) 82%, transparent);
    }
    .team-kpi-chip span {
      min-width: 0;
      font-weight: 800;
    }
    .team-kpi-chip strong,
    .team-kpi-chip em {
      color: var(--mx-muted);
      font-size: 12px;
      font-style: normal;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }
    button.employee-card {
      border: 1px solid var(--mx-line);
      color: inherit;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    button.employee-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--mx-shadow-soft);
      border-color: color-mix(in srgb, var(--mx-info) 42%, var(--mx-line));
    }
    .avatar-ring {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(17, 109, 143, .92), rgba(15, 122, 79, .82)),
        var(--mx-ink);
      color: #fffaf0;
      font-weight: 900;
      font-size: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 10px 24px rgba(16,19,25,.18);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-ring span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }
    .header-avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      font-size: 17px;
    }
    .control-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, .9fr) minmax(160px, .9fr) minmax(210px, auto);
      align-items: center;
      gap: 16px;
      padding: 16px;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      background: var(--mx-panel);
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .donut-wrap {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }
    .donut-legend {
      display: grid;
      gap: 10px;
    }
    .donut-legend-row {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .donut-legend-row span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .donut-legend-row strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .donut-legend-row em {
      color: var(--mx-muted);
      font-style: normal;
      font-weight: 800;
      white-space: nowrap;
    }
    .stacked-chart {
      display: grid;
      gap: 14px;
    }
    .stacked-row {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(180px, 1fr) 74px;
      gap: 14px;
      align-items: center;
    }
    .stacked-name {
      min-width: 0;
    }
    .stacked-name strong,
    .stacked-name span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stacked-name span {
      color: var(--mx-muted);
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
    }
    .stacked-track {
      min-width: 130px;
      max-width: 100%;
      height: 20px;
      display: flex;
      overflow: hidden;
      border-radius: 999px;
      background: var(--mx-surface-strong);
      box-shadow: inset 0 0 0 1px var(--mx-line);
    }
    .seg.done { background: var(--mx-success); }
    .seg.process { background: var(--mx-info); }
    .seg.backlog { background: var(--mx-danger); opacity: .82; }
    .stacked-meta {
      font-weight: 900;
      color: var(--mx-text);
      text-align: right;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--mx-muted);
      font-size: 12px;
      font-weight: 900;
      margin-top: 4px;
    }
    .chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot.done { background: var(--mx-success); }
    .legend-dot.process { background: var(--mx-info); }
    .legend-dot.backlog { background: var(--mx-danger); }
    .axis-title {
      fill: var(--mx-muted);
      font-size: 12px;
      font-weight: 900;
    }
    .radar-wrap {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(160px, 1fr);
      gap: 16px;
      align-items: center;
    }
    .radar-score {
      background: var(--mx-surface);
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 18px;
    }
    .radar-score strong {
      display: block;
      font-size: 48px;
      line-height: 1;
      font-weight: 900;
    }
    .radar-score span {
      display: block;
      margin-top: 8px;
      color: var(--mx-muted);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 11px;
    }
    .heatmap-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .heatmap-grid {
      display: grid;
      gap: 6px;
      min-width: 820px;
    }
    .heat-head,
    .heat-team,
    .heat-cell {
      border-radius: 8px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--mx-line);
    }
    .heat-head {
      background: var(--mx-surface-strong);
      color: var(--mx-muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 8px;
    }
    .heat-head.vertical {
      writing-mode: vertical-rl;
      max-height: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .heat-team {
      justify-content: flex-start;
      padding-inline: 12px;
      font-weight: 900;
      background: var(--mx-panel-strong);
    }
    .heat-cell {
      color: #fff;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0,0,0,.22);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(16, 19, 25, .52);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-card {
      width: min(1180px, 100%);
      max-height: min(860px, calc(100vh - 48px));
      overflow: auto;
      position: relative;
      background: var(--mx-panel);
      border: 1px solid var(--mx-line-strong);
      border-radius: 14px;
      box-shadow: var(--mx-shadow);
      padding: 26px;
    }
    .modal-close {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--mx-line);
      background: var(--mx-panel-strong);
      color: var(--mx-text);
      cursor: pointer;
      font-weight: 900;
    }
    .modal-avatar {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      font-size: 26px;
    }
    .modal-metrics {
      width: min(420px, 100%);
    }
    .team-modal-card {
      width: min(1260px, 100%);
    }
    .team-member-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 74px;
      max-width: 720px;
      padding: 12px 14px;
      border: 1px solid var(--mx-line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--mx-panel-strong) 72%, transparent);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--mx-panel-strong) 48%, transparent);
    }
    .team-member-avatars {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .team-member-avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      margin-left: -10px;
      border-width: 3px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .14);
      flex: 0 0 auto;
    }
    .team-member-avatar:first-child {
      margin-left: 0;
    }
    .team-member-more {
      width: 48px;
      height: 48px;
      margin-left: -10px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, .78);
      background: var(--mx-text);
      color: white;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .14);
      flex: 0 0 auto;
    }
    .team-member-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .team-member-copy strong {
      font-size: 13px;
      font-weight: 950;
    }
    .team-member-copy span {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--mx-muted);
      font-size: 12px;
      font-weight: 700;
    }
    .team-modal-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, .85fr);
      gap: 20px;
    }
    .team-modal-scroll {
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
    }
    .team-person-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--mx-line);
      border-radius: 12px;
      padding: 12px;
      background: var(--mx-panel-strong);
    }
    .team-person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      flex: 0 0 auto;
    }
    .team-urgent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
    }
    @keyframes lift-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mx-card {
      animation: lift-in 520ms cubic-bezier(.2,.8,.2,1) both;
    }
    .presentation-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
      gap: 20px;
    }
    @media (max-width: 1180px) {
      .presentation-grid { grid-template-columns: 1fr; }
      .kpi-analysis-grid { grid-template-columns: 1fr; }
      .kpi-insight-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi-row-card { grid-template-columns: 42px minmax(0, 1fr); }
      .kpi-row-stats {
        grid-column: 1 / -1;
        text-align: left;
      }
      .control-row { grid-template-columns: 1fr; }
      .filter-pills { justify-content: flex-start; }
      .executive-header-grid {
        grid-template-columns: 1fr;
      }
      .executive-controls {
        justify-content: start;
        grid-template-columns: minmax(150px, 180px) minmax(150px, 180px) minmax(110px, 130px) minmax(132px, auto) minmax(92px, auto) minmax(88px, auto);
      }
      .executive-controls .print-btn {
        grid-column: auto;
      }
      .hero-band .presentation-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 640px) {
      .display-title {
        font-size: 32px;
        line-height: 1.08;
      }
      .control-panel {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }
      .control-panel .mx-input,
      .control-panel .mx-btn {
        width: 100% !important;
      }
      .control-panel .mx-input:first-child {
        grid-column: 1 / -1;
      }
      .executive-controls {
        grid-template-columns: 1fr 1fr;
      }
      .executive-controls .mx-input:first-child,
      .executive-controls .mx-btn {
        grid-column: auto;
      }
      .executive-controls .mx-btn-primary {
        grid-column: 1 / -1;
      }
      .presentation-grid { gap: 14px; }
      .kpi-insight-grid { grid-template-columns: 1fr; }
      .kpi-row-card {
        grid-template-columns: 1fr;
      }
      .kpi-row-rank {
        width: auto;
        height: auto;
        padding: 9px 12px;
        place-items: start;
      }
      .kpi-row-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .watch-row {
        grid-template-columns: 1fr;
      }
      .watch-score {
        text-align: left;
      }
      .team-kpi-chip {
        grid-template-columns: 1fr;
      }
      .team-kpi-chip strong,
      .team-kpi-chip em {
        text-align: left;
      }
      .team-modal-grid {
        grid-template-columns: 1fr;
      }
      .metric-card { min-height: 142px; }
      .tab-strip {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .tab-button {
        min-width: 0;
        padding-inline: 10px;
      }
      .tab-button span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .employee-grid { grid-template-columns: 1fr; }
      .donut-wrap,
      .radar-wrap,
      .stacked-row {
        grid-template-columns: 1fr;
      }
      .stacked-meta {
        text-align: left;
      }
      .modal-backdrop {
        padding: 10px;
      }
      .modal-card {
        max-height: calc(100vh - 20px);
        padding: 18px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .mx-card { animation: none; }
    }
    @media print {
      body { background: #ffffff; }
      .no-print { display: none !important; }
      .mx-card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/config.js"></script>
  <script src="/js/api.js"></script>
  <script type="text/babel" src="/js/executive-dashboard.js"></script>
</body>
</html>
